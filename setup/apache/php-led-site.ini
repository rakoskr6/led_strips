; Installed to /etc/php/8.4/apache2/conf.d/99-led-site.ini
; Don't send the PHP version in an X-Powered-By header
expose_php = Off
; Session cookie (holds the CSRF token): not readable by JavaScript, only sent
; by the site's own pages, and only session ids the server created are accepted
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
