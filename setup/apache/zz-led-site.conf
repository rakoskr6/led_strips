# Installed to /etc/apache2/conf-available/zz-led-site.conf (a2enconf zz-led-site).
# The "zz-" makes it load after Debian's security.conf, which sets these too.
# Don't advertise the Apache, OS or PHP versions in headers and error pages.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Stops the "Could not reliably determine the server's fully qualified domain name" warning
ServerName localhost
