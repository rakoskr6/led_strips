# Apache site for the lights' website. Installed to
# /etc/apache2/sites-available/led-site.conf and enabled with `a2ensite led-site`
# (the Debian default site is disabled). See setup/README.md.
<VirtualHost *:80>
    DocumentRoot /var/www/christmas_led_site

    <Directory /var/www/christmas_led_site>
        # No folder listings; no .htaccess files
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # The site is a git checkout: never serve the .git folder, and don't serve
    # files that aren't web pages (README, leftover Python, lib.php on its own)
    RedirectMatch 404 "/\.git"
    RedirectMatch 404 "\.(md|py)$"
    RedirectMatch 404 "^/lib\.php$"

    ErrorDocument 404 /404.php

    ErrorLog ${APACHE_LOG_DIR}/led-site-error.log
    CustomLog ${APACHE_LOG_DIR}/led-site-access.log combined
</VirtualHost>
