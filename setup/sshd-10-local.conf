# Installed to /etc/ssh/sshd_config.d/10-local.conf by setup/base-system.sh.
# sshd uses the first value it reads for each option, and the files in
# sshd_config.d are read in name order. The "10-" prefix makes this file win
# over 50-cloud-init.conf, which Raspberry Pi Imager writes and which can
# turn password logins back on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
